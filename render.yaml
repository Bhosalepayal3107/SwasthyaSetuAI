services:
  - type: web
    name: swasthyasetu-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: swasthyasetu-db
          property: connectionString

databases:
  - name: swasthyasetu-db
    databaseName: swasthyasetu
    user: swasthyasetu_user
    plan: free
